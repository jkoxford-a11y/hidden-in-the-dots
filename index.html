<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hidden in the Dots</title>
<meta name="description" content="Press and hold: random dots become a dog. A demo of the Gestalt principle of common fate.">
<style>
  :root { --bg: #1d1f24; --ink: #fafaf7; --soft: #c8ccd2; --accent: #e8590c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .msg {
    position: fixed; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom));
    padding: 0 24px; text-align: center; pointer-events: none;
  }
  .msg p { font-size: clamp(20px, 5.4vw, 30px); font-weight: 700; line-height: 1.3; }
  .msg small { display: block; margin-top: 8px; font-size: clamp(15px, 3.8vw, 19px); color: var(--soft); line-height: 1.4; }
  .msg b { color: var(--accent); }
  .pill {
    display: inline-block; padding: 12px 22px; border-radius: 999px;
    background: rgba(29, 31, 36, 0.85); border: 2px solid var(--accent);
  }
  .hidden { opacity: 0; transition: opacity 0.25s; }
  .shown { opacity: 1; transition: opacity 0.4s; }
</style>
</head>
<body>
<canvas id="c" aria-label="A field of moving dots. Press and hold to make some of them move together."></canvas>
<div class="msg">
  <div id="prompt" class="shown"><p class="pill">Press and hold anywhere</p></div>
  <div id="after" class="hidden" hidden>
    <p>Every dot is just a dot.<br>Moving together, they're a <b>dog</b>.</p>
    <small>Common fate: things that move together are seen as one thing.<br>The whole is different from the sum of its parts.</small>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const promptEl = document.getElementById('prompt');
  const afterEl = document.getElementById('after');
  const debug = new URLSearchParams(location.search).has('debug');

  // Dog silhouette, side view facing right, in a 1 x 0.75 box.
  function dogPath(c) {
    c.beginPath();
    c.ellipse(0.47, 0.40, 0.27, 0.12, 0, 0, Math.PI * 2);              // body
    c.moveTo(0.66, 0.33); c.lineTo(0.72, 0.16); c.lineTo(0.84, 0.18);  // neck
    c.lineTo(0.78, 0.40); c.closePath();
    c.moveTo(0.86, 0.18); c.arc(0.78, 0.18, 0.08, 0, Math.PI * 2);     // head
    c.moveTo(0.80, 0.12); c.lineTo(1.00, 0.17);                        // long muzzle
    c.lineTo(1.00, 0.26); c.lineTo(0.80, 0.27); c.closePath();
    c.moveTo(0.70, 0.11); c.lineTo(0.77, 0.10);                        // drooping ear
    c.lineTo(0.71, 0.31); c.lineTo(0.65, 0.27); c.closePath();
    for (const x of [0.25, 0.35, 0.56, 0.66]) c.rect(x, 0.42, 0.08, 0.31); // legs
    c.moveTo(0.22, 0.34); c.lineTo(0.03, 0.20);                        // tail
    c.lineTo(0.07, 0.14); c.lineTo(0.25, 0.29); c.closePath();
    c.fill('nonzero');
  }

  let W, H, dpr, mask, maskW, dots = [];
  const SPEED = 70;          // px per second, same for every dot
  const LIFE = 0.45;         // seconds; short lives keep density uniform

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Fit the dog in the upper part of the screen, above the message.
    const usableH = H * 0.72;
    const scale = Math.min(W * 0.92, usableH / 0.75);
    const ox = (W - scale) / 2, oy = (usableH - scale * 0.75) / 2 + H * 0.02;
    const m = document.createElement('canvas');
    m.width = maskW = Math.ceil(W); m.height = Math.ceil(H);
    const mc = m.getContext('2d');
    mc.setTransform(scale, 0, 0, scale, ox, oy);
    mc.fillStyle = '#fff';
    dogPath(mc);
    const px = mc.getImageData(0, 0, m.width, m.height).data;
    mask = new Uint8Array(m.width * m.height);
    for (let i = 0; i < mask.length; i++) mask[i] = px[i * 4 + 3] > 127 ? 1 : 0;

    const n = Math.round(Math.min(7000, (W * H) / 42));
    dots = Array.from({ length: n }, () => spawn({}, Math.random() * LIFE));
  }

  function inDog(x, y) {
    const xi = x | 0, yi = y | 0;
    if (xi < 0 || yi < 0 || xi >= maskW || yi >= H) return false;
    return mask[yi * maskW + xi] === 1;
  }

  function spawn(d, age = 0) {
    d.x = Math.random() * W; d.y = Math.random() * H;
    const a = Math.random() * Math.PI * 2;
    d.vx = Math.cos(a); d.vy = Math.sin(a);
    d.age = age;
    return d;
  }

  let holding = false, revealedOnce = false;
  function setHold(on) {
    if (on === holding) return;
    holding = on;
    if (on) {
      promptEl.className = 'hidden';
      afterEl.className = 'hidden';
    } else {
      revealedOnce = true;
      afterEl.hidden = false;
      requestAnimationFrame(() => { afterEl.className = 'shown'; });
    }
  }
  window.addEventListener('pointerdown', e => { e.preventDefault(); setHold(true); });
  window.addEventListener('pointerup', () => setHold(false));
  window.addEventListener('pointercancel', () => setHold(false));
  window.addEventListener('blur', () => setHold(false));
  window.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); setHold(true); } });
  window.addEventListener('keyup', e => { if (e.code === 'Space') setHold(false); });
  window.addEventListener('resize', resize);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    ctx.fillStyle = '#1d1f24';
    ctx.fillRect(0, 0, W, H);
    const step = SPEED * dt;
    ctx.fillStyle = '#fafaf7';
    for (const d of dots) {
      d.age += dt;
      if (d.age > LIFE) spawn(d);
      const fig = inDog(d.x, d.y);
      if (holding && fig) { d.x += step; }          // the dog's dots share one motion
      else { d.x += d.vx * step; d.y += d.vy * step; } // everything else wanders
      if (debug && fig) ctx.fillStyle = '#e8590c';
      ctx.fillRect(d.x - 1.3, d.y - 1.3, 2.6, 2.6);
      if (debug && fig) ctx.fillStyle = '#fafaf7';
    }
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
